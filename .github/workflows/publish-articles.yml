name: Terbitkan Artikel Ruang Gagasan
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'scripts/build_posts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Persiapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install paket artikel
        run: pip install 'pyyaml>=6,<7' 'mistune>=3,<4' 'bleach>=6,<7'
      - name: Bangun daftar artikel
        run: python scripts/build_posts.py
      - name: Simpan dan terbitkan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cms-posts.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publikasikan pembaruan artikel dari Pages CMS'
            git push
          fi
